# Node.js with Angular
# Build a Node.js project that uses Angular.

trigger:
- develop
- staging
- main

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self
  persistCredentials: true

- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js 20.x'

- script: |
    npm install -g @angular/cli@20.x
    npm install
  displayName: 'Install Dependencies'

# main => production
- script: |
    npm run build -- --configuration=production
  displayName: 'Build Production'
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')

# staging => uat
- script: |
    npm run build -- --configuration=uat
  displayName: 'Build Staging/UAT'
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/staging')

# develop => dev
- script: |
    npm run build
  displayName: 'Build Development'
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')

# Publish the built 'dist' directory as the pipeline artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish Build Artifact: drop'
  inputs:
    PathtoPublish: 'dist'
    ArtifactName: 'drop'
    publishLocation: 'Container'
